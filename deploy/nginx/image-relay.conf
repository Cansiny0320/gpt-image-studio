# Install as /etc/nginx/conf.d/gpt-image-relay.conf after issuing the certificate.
# The root-only secret snippet contains: set $studio_relay_token "RANDOM_TOKEN";
server {
    listen 80;
    server_name image-origin.cansiny.top;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/gpt-image-relay/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 8443 ssl;
    server_name image-origin.cansiny.top;
    ssl_certificate /etc/letsencrypt/live/gpt-image-relay/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpt-image-relay/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 40m;
    client_body_timeout 30s;
    include /etc/nginx/snippets/gpt-image-relay-secret.conf;

    location ~ ^/v1/images/(generations|edits)$ {
        if ($request_method != POST) { return 405; }
        if ($http_x_studio_relay_token != $studio_relay_token) { return 403; }

        resolver 1.1.1.1 1.0.0.1 ipv6=off valid=300s;
        set $studio_openai_origin https://api.openai.com;
        proxy_pass $studio_openai_origin$request_uri;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host api.openai.com;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name api.openai.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 250s;
        proxy_send_timeout 250s;
        add_header Cache-Control "no-store" always;
    }
    location / { return 404; }
}
